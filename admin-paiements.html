  <style>

    :root {
      --ink: #0b1a24;
      --ink-soft: #5c6e7b;
      --green: #1f6b4f;

      --green-soft: #eef7f1;

      --sand: #eef4f2;

      --sand-stroke: #d5e2df;

      --white: #ffffff;

    * {

    body {

        Inter,

        sans-serif;
    }

    .page {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 60px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .brand span {
      color: var(--green);
    }

    .logout-btn {
      border: 1px solid var(--sand-stroke);

    }

    }

    .status {

      border-radius: 10px;
      display: none;
      font-size: 14px;
      line-height: 1.5;

    .status.show {

    }

    .status.info {

    .status.error {

    .loading {

      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .detail {
      background: var(--sand-soft);
      border: 1px solid var(--sand-stroke);
      border-radius: 12px;
      padding: 12px;
    }

    .detail-label {
      font-size: 12px;

      margin-bottom: 5px;
    }

    .detail-value {
      font-weight: 700;
      word-break: break-word;
    }

    .reference {
      background: var(--green-soft);
      border: 1px solid #d8eadf;

      margin-bottom: 18px;
    }

    .reference-label {
      font-size: 12px;

    .btn {

    }

    .count {

<script>

  // =========================================================
  // CONFIGURATION SUPABASE
  // =========================================================

  const SUPABASE_URL =
    'https://ksihdowudyadlkhvybnj.supabase.co';

  const SUPABASE_ANON_KEY =
    'sb_publishable_uI77bn8PKuFBVKRZLo86Sg_2k9-aF53';

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  // =========================================================
  // ELEMENTS
  // =========================================================

  const loadingEl =
    document.getElementById('loading');

  const contentEl =
    document.getElementById('content');

  const paymentsEl =
    document.getElementById('payments');

  const countEl =
    document.getElementById('payment-count');

  const statusEl =
    document.getElementById('status');

  const logoutBtn =
    document.getElementById('logout-btn');

  const rejectModal =
    document.getElementById('reject-modal');

  const rejectReasonEl =
    document.getElementById('reject-reason');

  const cancelRejectBtn =
    document.getElementById('cancel-reject');

  const confirmRejectBtn =
    document.getElementById('confirm-reject');


  let currentRejectEnrollmentId = null;


  // =========================================================
  // UTILITAIRES
  // =========================================================

  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return '';
    }

    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  }


  function formatAmount(value) {

    const amount =
      Number(value || 0);

    return new Intl.NumberFormat(
      'fr-FR'
    ).format(amount) + ' Ar';

  }


  function formatDate(value) {

    if (!value) {
      return '—';
    }

    const date =
      new Date(value);

    if (Number.isNaN(date.getTime())) {
      return '—';
    }

    return date.toLocaleString(
      'fr-FR',
      {
        dateStyle: 'medium',
        timeStyle: 'short'
      }
    );

  }


  function showStatus(
    message,
    type = 'info'
  ) {

    statusEl.textContent =
      message;

    statusEl.className =
      'status show ' + type;

  }


  function hideStatus() {

    statusEl.textContent = '';

    statusEl.className =
      'status';

  }


  // =========================================================
  // VERIFICATION SESSION + ADMIN
  // =========================================================

  async function checkAdmin() {

  const {
    data: { session },
    error: sessionError
  } = await supabaseClient.auth.getSession();

  console.log('Session admin :', session);
  console.log('Erreur session :', sessionError);

  if (!session) {
    window.location.href = 'connexion.html';
    return false;
  }

  const {
    data: role,
    error: roleError
  } = await supabaseClient.rpc('current_user_role');

  console.log('Rôle retourné :', role);
  console.log('Erreur current_user_role :', roleError);

  if (roleError) {
    console.error(
      'Erreur rôle utilisateur :',
      roleError
    );

    showStatus(
      'Impossible de vérifier votre rôle administrateur : ' +
      roleError.message,
      'error'
    );

    loadingEl.style.display = 'none';

    return false;
  }

  if (role !== 'admin') {
    showStatus(
      'Accès refusé : cette page est réservée aux administrateurs.',
      'error'
    );

    loadingEl.style.display = 'none';

    return false;
  }

  return true;
}

  // =========================================================
  // CHARGEMENT DES PAIEMENTS
  // =========================================================

 async function loadPayments() {

  loadingEl.style.display = 'block';
  contentEl.style.display = 'none';
  hideStatus();

  console.log('Chargement des paiements admin...');

  const {
    data: {
      session
    }
  } = await supabaseClient.auth.getSession();

  if (!session) {
    console.error('Aucune session admin.');
    window.location.href = 'connexion.html';
    return;
  }

  console.log('Admin connecté :', session.user.email);

  const {
    data,
    error
  } = await supabaseClient
    .from('course_enrollments')
    .select(`
      id,
      user_id,
      course_name,
      plan_code,
      regular_price,
      discount_amount,
      amount_paid,
      status,
      payment_status,
      payment_reference,
      payment_submitted_at,
      payment_proof_path,
payment_rejection_reason,
language_count,
created_at
    `)
    .eq('payment_status', 'pending')
    .order('payment_submitted_at', {
      ascending: true,
      nullsFirst: false
    });

  console.log('Paiements récupérés :', data);
  console.log('Erreur :', error);

  if (error) {

    console.error(
      'Erreur Supabase chargement paiements :',
      error
    );

    loadingEl.style.display = 'none';

    showStatus(
      'Erreur lors du chargement : ' + error.message,
      'error'
    );

    return;
  }

  const payments = data || [];

  // Récupérer les profils correspondant aux user_id
  const userIds = [
    ...new Set(
      payments
        .map(payment => payment.user_id)
        .filter(Boolean)
    )
  ];

  let profiles = [];

  if (userIds.length) {

    const {
      data: profileData,
      error: profileError
    } = await supabaseClient
      .from('profiles')
      .select(`
        id,
        first_name,
        last_name
      `)
      .in('id', userIds);

    if (profileError) {

      console.error(
        'Erreur chargement profils :',
        profileError
      );

    } else {

      profiles = profileData || [];
    }
  }

  // Associer chaque profil à son paiement
  const profilesById = {};

  profiles.forEach(profile => {
    profilesById[profile.id] = profile;
  });

  payments.forEach(payment => {
    payment.profile = profilesById[payment.user_id] || null;
  });

  console.log('Paiements avec profils :', payments);

  loadingEl.style.display = 'none';
  contentEl.style.display = 'block';

  countEl.textContent =
    payments.length === 0
      ? 'Aucun paiement en attente.'
      : `${payments.length} paiement${payments.length > 1 ? 's' : ''} en attente.`;

  renderPayments(payments);
}


  // =========================================================
  // AFFICHAGE
  // =========================================================

  function renderPayments(
    payments
  ) {

    if (!payments.length) {

      paymentsEl.innerHTML = `
        <div class="empty">

          <strong>
            Aucun paiement à valider
          </strong>

          <div style="margin-top:8px;">
            Les nouveaux paiements apparaîtront ici
            lorsqu'un membre aura envoyé sa référence.
          </div>

        </div>
      `;

      return;

    }


    paymentsEl.innerHTML =
      payments
        .map(
          payment =>
            renderPaymentCard(
              payment
            )
        )
        .join('');

  }


  function renderPaymentCard(
    payment
  ) {

    const amountDue =
      Number(
        payment.regular_price || 0
      )
      -
      Number(
        payment.discount_amount || 0
      );


    const planLabels = {

      basic:
        'Essentiel',

      advanced:
        'Pro',

      expert:
        'Expert',

      bootcamp:
        'Bootcamp',

      member:
        'Membres'

    };


    const planName =
      planLabels[
        payment.plan_code
      ]
      ||
      payment.plan_code
      ||
      'Formation';


    return `

      <article
        class="payment-card"
        id="payment-${payment.id}"
      >

        <div class="payment-header">

          <div>

            <h2 class="payment-title">
              ${escapeHtml(planName)}
            </h2>

            <div class="payment-subtitle">
              Inscription #${escapeHtml(payment.id)}
            </div>

          </div>

          <span class="badge">
            Paiement à vérifier
          </span>

        </div>


        <div class="details">

          <div class="detail">

            <div class="detail-label">
              Plan
            </div>

            <div class="detail-value">
              ${escapeHtml(planName)}
            </div>

          </div>

          <div class="detail">

  <div class="detail-label">
    Nombre de langues
  </div>

  <div class="detail-value">
    ${escapeHtml(payment.language_count || 1)}
    langue${Number(payment.language_count || 1) > 1 ? 's' : ''}
  </div>

</div>


          <div class="detail">

            <div class="detail-label">
              Montant à payer
            </div>

            <div class="detail-value">
              ${formatAmount(amountDue)}
            </div>

          </div>


          <div class="detail">

  <div class="detail-label">
    Utilisateur
  </div>

  <div class="detail-value">
    ${
      payment.profile
        ? `${escapeHtml(payment.profile.first_name || '')} ${escapeHtml(payment.profile.last_name || '')}`.trim()
        : 'Nom non disponible'
    }
  </div>

</div>


          <div class="detail">

            <div class="detail-label">
              Date de soumission
            </div>

            <div class="detail-value">
              ${formatDate(payment.payment_submitted_at)}
            </div>

          </div>

        </div>


        <div class="reference">

          <div class="reference-label">
            Référence du paiement
          </div>

          <div class="reference-value">
            ${escapeHtml(payment.payment_reference)}
          </div>

        </div>


        ${
          payment.payment_proof_path
            ? `
              <div class="proof">

                <a
                  href="#"
                  onclick="openPaymentProof('${escapeHtml(payment.payment_proof_path)}'); return false;"
                >
                  Voir la preuve de paiement →
                </a>

              </div>
            `
            : `
              <div
                class="proof"
                style="color:var(--ink-soft);font-size:14px;"
              >
                Aucune preuve de paiement jointe.
              </div>
            `
        }


        <div class="actions">

          <button
            type="button"
            class="btn btn-validate"
            onclick="validatePayment(${payment.id})"
          >
            ✓ Valider le paiement
          </button>


          <button
            type="button"
            class="btn btn-reject"
            onclick="openRejectModal(${payment.id})"
          >
            Rejeter
          </button>

        </div>

      </article>

    `;

  }


  // =========================================================
  // PREUVE DE PAIEMENT
  // =========================================================

  async function openPaymentProof(
    path
  ) {

    if (!path) {
      return;
    }


    showStatus(
      'Génération du lien sécurisé…',
      'info'
    );


    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from('payment-proofs')
        .createSignedUrl(
          path,
          300
        );


    if (error) {

      console.error(
        'Erreur preuve paiement :',
        error
      );

      showStatus(
        'Impossible d’ouvrir la preuve de paiement.',
        'error'
      );

      return;

    }


    hideStatus();


    if (data?.signedUrl) {

      window.open(
        data.signedUrl,
        '_blank',
        'noopener,noreferrer'
      );

    }

  }


  // =========================================================
  // VALIDATION
  // =========================================================

  async function validatePayment(
    enrollmentId
  ) {

    const confirmed =
      window.confirm(
        'Confirmer la validation de ce paiement ?\n\nL’accès à la formation sera activé.'
      );


    if (!confirmed) {
      return;
    }


    const button =
      document.querySelector(
        `#payment-${enrollmentId} .btn-validate`
      );


    if (button) {

      button.disabled =
        true;

      button.textContent =
        'Validation…';

    }


    hideStatus();


    const {
      data,
      error
    } =
      await supabaseClient
        .rpc(
          'validate_course_payment',
          {
            input_enrollment_id:
              enrollmentId
          }
        );


    if (error) {

      console.error(
        'Erreur validation paiement :',
        error
      );


      if (button) {

        button.disabled =
          false;

        button.textContent =
          '✓ Valider le paiement';

      }


      showStatus(
        error.message ||
        'Impossible de valider le paiement.',
        'error'
      );

      return;

    }


    showStatus(
      'Paiement validé. L’accès à la formation a été activé.',
      'info'
    );


    const card =
      document.getElementById(
        `payment-${enrollmentId}`
      );


    if (card) {

      card.remove();

    }


    updateCountAfterAction();

  }


  // =========================================================
  // REJET
  // =========================================================

  function openRejectModal(
    enrollmentId
  ) {

    currentRejectEnrollmentId =
      enrollmentId;

    rejectReasonEl.value =
      '';

    rejectModal.classList.add(
      'show'
    );

    setTimeout(
      () => rejectReasonEl.focus(),
      50
    );

  }


  function closeRejectModal() {

    currentRejectEnrollmentId =
      null;

    rejectReasonEl.value =
      '';

    rejectModal.classList.remove(
      'show'
    );

  }


  cancelRejectBtn.addEventListener(
    'click',
    closeRejectModal
  );


  rejectModal.addEventListener(
    'click',
    event => {

      if (
        event.target ===
        rejectModal
      ) {

        closeRejectModal();

      }

    }
  );


  confirmRejectBtn.addEventListener(
    'click',
    async () => {

      const enrollmentId =
        currentRejectEnrollmentId;


      if (!enrollmentId) {
        return;
      }


      const reason =
        rejectReasonEl.value.trim();


      if (!reason) {

        alert(
          'Veuillez indiquer la raison du rejet.'
        );

        rejectReasonEl.focus();

        return;

      }


      confirmRejectBtn.disabled =
        true;

      confirmRejectBtn.textContent =
        'Rejet…';


      const {
        data,
        error
      } =
        await supabaseClient
          .rpc(
            'reject_course_payment',
            {
              input_enrollment_id:
                enrollmentId,

              input_reason:
                reason
            }
          );


      if (error) {

        console.error(
          'Erreur rejet paiement :',
          error
        );


        confirmRejectBtn.disabled =
          false;

        confirmRejectBtn.textContent =
          'Rejeter le paiement';


        showStatus(
          error.message ||
          'Impossible de rejeter le paiement.',
          'error'
        );

        return;

      }


      closeRejectModal();


      showStatus(
        'Paiement rejeté.',
        'warning'
      );


      const card =
        document.getElementById(
          `payment-${enrollmentId}`
        );


      if (card) {

        card.remove();

      }


      updateCountAfterAction();

    }
  );


  // =========================================================
  // COMPTEUR
  // =========================================================

  function updateCountAfterAction() {

    const cards =
      paymentsEl.querySelectorAll(
        '.payment-card'
      );


    const count =
      cards.length;


    countEl.textContent =
      count === 0
        ? 'Aucun paiement en attente.'
        : `${count} paiement${count > 1 ? 's' : ''} en attente.`;


    if (count === 0) {

      paymentsEl.innerHTML = `

        <div class="empty">

          <strong>
            Aucun paiement à valider
          </strong>

          <div style="margin-top:8px;">
            Tous les paiements en attente ont été traités.
          </div>

        </div>

      `;

    }

  }


  // =========================================================
  // DECONNEXION
  // =========================================================

  logoutBtn.addEventListener(
    'click',
    async () => {

      await supabaseClient
        .auth
        .signOut();

      window.location.href =
        'connexion.html';

    }
  );


  // =========================================================
  // INITIALISATION
  // =========================================================

  async function init() {

  const isAdmin =
    await checkAdmin();

  if (!isAdmin) {
    return;
  }

  await loadPayments();

}


  init();

</script>

</body>
</html>
