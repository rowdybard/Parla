<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Activité — Parla by Hitondra</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=Figtree:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --purple: #73d6b5;
      --purple-dark: #45c99d;
      --bg: #f6fbf9;
      --card: #ffffff;
      --text: #202a27;
      --muted: #6e8291;
      --border: #e4efeb;
      --green: #2e9d68;
      --red: #d94b4b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--f-body);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .page {
      max-width: 1250px;
      margin: 0 auto;
      padding: 30px 22px 60px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .brand {
      font-family: var(--f-display);
      font-size: 30px;
      color: var(--purple);
    }

    .back-link {
      text-decoration: none;
      color: var(--muted);
      font-weight: 600;
    }

    .page-title {
      margin: 0 0 8px;
      font-family: var(--f-display);
      font-size: 34px;
    }

    .page-subtitle {
      margin: 0 0 28px;
      color: var(--muted);
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(8, 20, 29, 0.05);
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
    }

    input,
textarea,
select {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  background: #fff;
  color: var(--text);
  outline: none;
}

input[type="checkbox"],
input[type="radio"] {
  width: auto;
  padding: 0;
  margin: 0;
  flex: 0 0 auto;
}
    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--purple);
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-primary {
      background: var(--purple);
      color: white;
    }

    .btn-primary:hover {
      background: var(--purple-dark);
    }

    .btn-secondary {
      background: #edf8f4;
      color: var(--text);
    }

    .btn-danger {
      background: #fff0f0;
      color: var(--red);
    }

    .btn-small {
      padding: 7px 10px;
      font-size: 13px;
    }

    .mission-selector {
      margin-bottom: 30px;
    }

    .cards-layout {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr);
      gap: 22px;
    }

    .card-nav {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-tab {
      border: 1px solid var(--border);
      background: white;
      border-radius: 14px;
      padding: 14px;
      text-align: left;
      cursor: pointer;
      transition: 0.2s;
    }

    .card-tab:hover {
      border-color: var(--purple);
    }

    .card-tab.active {
      background: #f1fbf8;
      border-color: var(--purple);
    }

    .card-tab-number {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .card-tab-title {
      font-weight: 700;
    }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 22px;
    }

    .editor-header h2 {
      margin: 0;
      font-family: var(--f-display);
      font-size: 26px;
    }

    .elements-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 20px;
    }

    .element {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      background: #fcfefd;
    }

    .element-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .element-label {
      font-weight: 700;
    }

    .element-actions {
      display: flex;
      gap: 6px;
    }

    .element-content {
      display: grid;
      gap: 10px;
    }

    .add-element-box {
      margin-top: 20px;
      padding: 18px;
      border: 1px dashed #c9e8de;
      border-radius: 16px;
      background: #fafefd;
    }

    .add-element-row {
      display: flex;
      gap: 10px;
      align-items: end;
    }

    .add-element-row .field {
      flex: 1;
      margin: 0;
    }

    .bottom-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .status {
      margin-top: 15px;
      padding: 12px 14px;
      border-radius: 12px;
      display: none;
    }

    .status.success {
      display: block;
      background: #edf9f2;
      color: #23734b;
    }

    .status.error {
      display: block;
      background: #fff0f0;
      color: #a63838;
    }

    .preview-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 20, 29, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .preview-overlay.on {
      display: flex;
    }

    .preview-box {
      width: min(720px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: white;
      border-radius: 24px;
      padding: 28px;
      position: relative;
    }

    .preview-close {
      position: absolute;
      top: 15px;
      right: 15px;
      border: 0;
      background: #eef6f3;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
    }

    .preview-title {
      font-family: var(--f-display);
      font-size: 30px;
      margin: 0 0 8px;
    }

    .preview-instruction {
      color: var(--muted);
      margin-bottom: 25px;
    }

    .preview-element {
      padding: 18px;
      border-radius: 16px;
      background: #f6fdfb;
      margin-bottom: 14px;
    }

    .preview-element.hidden {
      display: none;
    }

    .preview-progress {
      text-align: center;
      color: var(--muted);
      margin: 20px 0 10px;
    }

    .preview-next {
      width: 100%;
      margin-top: 10px;
    }

    .empty {
      padding: 35px;
      text-align: center;
      color: var(--muted);
    }

    .media-preview {
      max-width: 100%;
      border-radius: 12px;
    }

    iframe {
      width: 100%;
      min-height: 360px;
      border: 0;
      border-radius: 14px;
    }

    @media (max-width: 800px) {
      .cards-layout {
        grid-template-columns: 1fr;
      }

      .card-nav {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
      }

      .card-tab {
        text-align: center;
      }

      .card-tab-title {
        font-size: 12px;
      }

      .add-element-row {
        flex-direction: column;
        align-items: stretch;
      }
    }

/* =========================
   PRÉVISUALISATION FORMATEUR
   ========================= */

#previewOverlay .preview-box {
  text-align: left;
}

#previewOverlay #previewElements {
  width: 100%;
  text-align: left;
}

#previewOverlay .preview-element {
  width: 100%;
  text-align: left;
}

/* Bloc de chaque exercice */
#previewOverlay .mission-exercise {
  width: 100%;
  max-width: 760px;
  margin: 0 0 24px 0;
  padding: 22px;
  box-sizing: border-box;

  background: #ffffff;
  border: 1px solid #e0ebe7;
  border-radius: 14px;

  text-align: left;
}

/* Question / consigne */
#previewOverlay .mission-exercise > strong {
  display: block;
  margin-bottom: 16px;

  color: #1f2428;
  font-size: 16px;
  line-height: 1.5;

  text-align: left;
}

/* Choix */
#previewOverlay .mission-options {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 10px;

  width: 100%;
}

#previewOverlay .mission-option {
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;
  gap: 10px;

  width: 100%;
  padding: 10px 12px;
  box-sizing: border-box;

  border: 1px solid #e0ebe7;
  border-radius: 9px;
  background: #f9fcfb;

  text-align: left;
}

/* =========================
   BOUTON CHECK ANSWER
   ========================= */

#previewOverlay .mission-check-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  margin-top: 18px;
  padding: 11px 18px;

  background: #1f6850 !important;
  color: #ffffff !important;

  border: none !important;
  border-radius: 9px;

  font-size: 14px;
  font-weight: 600;

  cursor: pointer;
}

#previewOverlay .mission-check-btn:hover {
  background: #174e3c !important;
}

/* =========================
   FEEDBACK
   ========================= */

#previewOverlay .mission-feedback {
  width: 100%;
  box-sizing: border-box;

  margin-top: 14px;
  padding: 12px 14px;

  border-radius: 9px;

  text-align: left;
  font-weight: 600;
}

#previewOverlay .mission-feedback.correct {
  background: #eaf7ee !important;
  border: 1px solid #b8dfc4 !important;
  color: #176b35 !important;
}

#previewOverlay .mission-feedback.incorrect {
  background: #fff0f0 !important;
  border: 1px solid #efbcbc !important;
  color: #a12626 !important;
}

/* =========================
   CLASSEMENT
   ========================= */

#previewOverlay .ordering-list {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;

  width: 100%;
}

#previewOverlay .ordering-item {
  width: 100%;
  box-sizing: border-box;
  text-align: left;
}

/* =========================
   CONSTRUCTION DE PHRASE
   ========================= */

#previewOverlay .build-sentence-list,
#previewOverlay .build-answer {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-start;
  align-items: flex-start;
  gap: 8px;

  width: 100%;
  text-align: left;
}
      
  
/* ===== Parla design ===== */
html,body{overflow-x:hidden}
.page-title{font-weight:700;letter-spacing:-.035em}
/* ===== Colour per card: the 5 stages of a mission, from the Parla palette (card 1 in purple, as the owner asked; it was amber) ===== */
:root{--s1:#8e4fc9;--s2:#2fbf8f;--s3:#1D9E75;--s4:#0F6E56;--s5:#2c5d7c;--stage:var(--s1)}
.cards-layout:has(.card-tab:nth-child(2).active){--stage:var(--s2)}
.cards-layout:has(.card-tab:nth-child(3).active){--stage:var(--s3)}
.cards-layout:has(.card-tab:nth-child(4).active){--stage:var(--s4)}
.cards-layout:has(.card-tab:nth-child(5).active){--stage:var(--s5)}
.card-tab:nth-child(1){--c:var(--s1)}.card-tab:nth-child(2){--c:var(--s2)}.card-tab:nth-child(3){--c:var(--s3)}.card-tab:nth-child(4){--c:var(--s4)}.card-tab:nth-child(5){--c:var(--s5)}

body{background:#fff} /* white behind the editor, as the owner asked */

.panel{border-color:#e1e9e6}
.mission-selector.panel,.panel.mission-selector{background:#fff}

.card-tab{position:relative;display:grid;grid-template-columns:30px 1fr;column-gap:12px;align-items:center;border-color:#e1e9e6;background:#fff;padding:12px 14px;transition:border-color .2s,background .2s,transform .2s}
.card-tab::before{content:counter(stage);counter-increment:stage;grid-row:span 2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff)}
.card-nav{counter-reset:stage}
.card-tab-number{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 70%,#0b1a24);margin:0}
.card-tab-title{font-family:var(--f-display);letter-spacing:-.01em}
.card-tab:hover{border-color:var(--c);transform:translateX(2px)}
.card-tab.active{background:color-mix(in srgb,var(--c) 11%,#fff);border-color:var(--c)}
.card-tab.active::before{background:var(--c);color:#fff}

.cards-layout>.panel{background:linear-gradient(180deg,color-mix(in srgb,var(--stage) 10%,#fff) 0,#fff 150px);border-color:color-mix(in srgb,var(--stage) 35%,#e1e9e6);transition:border-color .3s}
.editor-header h2{color:#0b1a24}
input:focus,textarea:focus,select:focus{border-color:var(--stage)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--stage) 18%,transparent)}
.btn{border-radius:999px}
.btn-primary{background:var(--stage)!important;color:#fff!important}
.btn-primary:hover{background:color-mix(in srgb,var(--stage) 82%,#0b1a24)!important}
.btn-secondary{background:color-mix(in srgb,var(--stage) 12%,#fff);color:#0b1a24}
.btn-secondary:hover{background:color-mix(in srgb,var(--stage) 20%,#fff)}
.element{background:#fff;border-color:color-mix(in srgb,var(--stage) 28%,#e1e9e6)}
.element-label{color:color-mix(in srgb,var(--stage) 75%,#0b1a24)}
.add-element-box{border-color:color-mix(in srgb,var(--stage) 45%,#fff);background:color-mix(in srgb,var(--stage) 5%,#fff)}
.preview-box{border-top:6px solid var(--s3)}
.preview-element{background:color-mix(in srgb,var(--s2) 7%,#fff)}
.cards-layout{grid-template-columns:236px minmax(0,1fr)!important}
.card-tab-title{font-size:15px;overflow-wrap:anywhere;min-width:0}
.card-tab>div{min-width:0}
.page{position:relative;z-index:1}
@media (max-width:800px){.cards-layout{grid-template-columns:1fr!important}.card-nav{display:flex!important;overflow-x:auto;gap:8px;padding-bottom:4px;scroll-snap-type:x mandatory}.card-tab{flex:0 0 auto;scroll-snap-align:start;text-align:left!important}.card-tab-title{white-space:nowrap;overflow-wrap:normal}.card-tab:hover{transform:none}}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="parla-languages.js"></script>
<script src="mission-renderer.js"></script>
    
<script>

const CARD_TYPES = {
  mise_en_route: "Mise en route",
  comprehension: "Compréhension",
  reperage: "Repérage",
  conceptualisation: "Conceptualisation",
  systematisation: "Systématisation"
};

const state = {
  user: null,
  profile: null,
  missions: [],
  selectedMission: null,
  activeCard: 1,

  cards: [1, 2, 3, 4, 5].map(order => ({
    order,
    title: CARD_TYPES[
      [
        "mise_en_route",
        "comprehension",
        "reperage",
        "conceptualisation",
        "systematisation"
      ][order - 1]
    ],
    instruction: "",
    elements: []
  })),

  previewIndex: 0,
previewOrdering: {}
};


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function getLanguageLabel(language) {

  const value = String(language || "").trim().toLowerCase();

  if (value === "français" || value === "fr") return "Français";
  if (value === "anglais" || value === "en") return "Anglais";
  if (value === "espagnol" || value === "es") return "Espagnol";

  return language || "";
}


function getCardType(order) {

  return [
    "mise_en_route",
    "comprehension",
    "reperage",
    "conceptualisation",
    "systematisation"
  ][order - 1];

}


async function init() {

  const {
    data: {
      user
    }
  } = await supabaseClient.auth.getUser();

  if (!user) {

    window.location.href = "connexion.html";
    return;

  }

  state.user = user;

  const {
    data: profile,
    error: profileError
  } = await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .single();

  if (profileError || !profile) {

    alert("Impossible de charger votre profil.");
    return;

  }

  state.profile = profile;

  const allowed =
    profile.role === "teacher" ||
    profile.role === "formateur" ||
    profile.role === "admin";

  if (!allowed) {

    alert("Accès réservé aux formateurs.");
    window.location.href = "membre.html";
    return;

  }

  await loadMissions();

async function loadMissions() {

  const {
    data,
    error
  } = await supabaseClient
    .from("missions")
    .select("*")
    .order("week_number", {
      ascending: true
    })
    .order("id", {
      ascending: true
    });

console.log("ACTIVITE — missions reçues :", data);
console.log("ACTIVITE — erreur missions :", error);
console.log("ACTIVITE — profil :", state.profile);
    
  if (error) {

    console.error(error);

    showStatus(
      "Impossible de charger les missions.",
      "error"
    );

    return;

  }

  const teacherLanguage = state.profile.language;

  if (state.profile.role === "admin") {

    state.missions = data || [];

  } else {

    // « Anglais » et « en » sont la même langue
    state.missions = (data || []).filter(mission =>
      ParlaLanguages.same(mission.language, teacherLanguage)
    );

  }

  renderMissionSelect();

  const params = new URLSearchParams(window.location.search);
  const missionIdFromUrl = Number(params.get("mission_id"));

  if (missionIdFromUrl) {
    const missionSelect = document.getElementById("missionSelect");

    const missionExists = state.missions.some(
      mission => Number(mission.id) === missionIdFromUrl
    );

    if (missionExists) {
      missionSelect.value = String(missionIdFromUrl);
      missionSelect.dispatchEvent(new Event("change"));
    }
  }

  console.log(
    "ACTIVITE — select après rendu :",
    document.getElementById("missionSelect").innerHTML
  );
    
}


function renderMissionSelect() {

  const select =
    document.getElementById("missionSelect");

  select.innerHTML =
    `<option value="">Sélectionnez une mission…</option>`;

  state.missions.forEach(mission => {

    const option =
      document.createElement("option");

    option.value = mission.id;

    option.textContent =
      `${mission.title} · ${getLanguageLabel(mission.language)} · ${mission.level || "—"} · Semaine ${mission.week_number || "—"}`;

    select.appendChild(option);

  });

}


async function loadMissionCards(missionId) {

  const {
    data,
    error
  } = await supabaseClient
    .from("mission_cards")
    .select("*")
    .eq("mission_id", missionId)
    .order("card_order", {
      ascending: true
    });

  if (error) {

    console.error(error);

    showStatus(
      "Impossible de charger les cartes.",
      "error"
    );

    return;

  }

  state.cards =
    [1, 2, 3, 4, 5].map(order => {

      const existing =
        (data || []).find(
          card => card.card_order === order
        );

      if (!existing) {

        return {
          order,
          title: CARD_TYPES[
            getCardType(order)
          ],
          instruction: "",
          elements: []
        };

      }

      const content =
        existing.content || {};

      return {
        order,
        title:
          content.title ||
          CARD_TYPES[getCardType(order)],

        instruction:
          content.instruction || "",

        elements:
          Array.isArray(content.elements)
            ? content.elements
            : []
      };

    });

  state.activeCard = 1;

  renderCardNavigation();
  renderActiveCard();

}


function renderCardNavigation() {

  const nav =
    document.getElementById("cardNavigation");

  nav.innerHTML = "";

  state.cards.forEach(card => {

    const button =
      document.createElement("button");

    button.type = "button";

    button.className =
      "card-tab" +
      (card.order === state.activeCard
        ? " active"
        : "");

    button.innerHTML = `
      <div class="card-tab-number">
        Carte ${card.order}
      </div>

      <div class="card-tab-title">
        ${escapeHtml(card.title || CARD_TYPES[getCardType(card.order)])}
      </div>
    `;

    button.addEventListener("click", () => {

      saveCurrentEditorToState();

      state.activeCard = card.order;

      renderCardNavigation();
      renderActiveCard();

    });

    nav.appendChild(button);

  });

}


function renderActiveCard() {

  const card =
    state.cards.find(
      c => c.order === state.activeCard
    );

  if (!card) return;

  document.getElementById("editorCardTitle").textContent =
    `Carte ${card.order} — ${CARD_TYPES[getCardType(card.order)]}`;

  document.getElementById("cardTitle").value =
    card.title || "";

  document.getElementById("cardInstruction").value =
    card.instruction || "";

  renderElements();

}


function saveCurrentEditorToState() {

  const card =
    state.cards.find(
      c => c.order === state.activeCard
    );

  if (!card) return;

  card.title =
    document.getElementById("cardTitle").value.trim();

  card.instruction =
    document.getElementById("cardInstruction").value.trim();

}

function addElement() {
  saveCurrentEditorToState();

  const type =
    document.getElementById("elementType").value;

  const card =
    state.cards.find(
      c => c.order === state.activeCard
    );

  if (!card) return;

  const element = {
    type
  };

  if (
    type === "text" ||
    type === "explanation"
  ) {
    element.content = "";

  } else if (type === "image") {
    element.url = "";
    element.alt = "";

  } else if (
    type === "audio" ||
    type === "youtube"
  ) {
    element.url = "";

  } else if (type === "true_false") {
    element.statement = "";
    element.correct = true;
    element.feedback_correct = "";
    element.feedback_incorrect = "";

  } else if (type === "multiple_choice") {
    element.question = "";
    element.options = [
      { id: "a", text: "" },
      { id: "b", text: "" },
      { id: "c", text: "" },
      { id: "d", text: "" }
    ];
    element.correct = [];
    element.feedback_correct = "";
    element.feedback_incorrect = "";

  } else if (type === "ordering") {
    element.question = "";
    element.items = [
      { id: "a", text: "" },
      { id: "b", text: "" },
      { id: "c", text: "" },
      { id: "d", text: "" }
    ];
    element.correct_order = [
      "a",
      "b",
      "c",
      "d"
    ];
    element.feedback_correct = "";
    element.feedback_incorrect = "";

  } else if (type === "matching") {
    element.question = "";
    element.pairs = [
      { id: "a", left: "", right: "" },
      { id: "b", left: "", right: "" },
      { id: "c", left: "", right: "" },
      { id: "d", left: "", right: "" }
    ];
    element.feedback_correct = "";
    element.feedback_incorrect = "";

  } else if (type === "categorise") {
    element.question = "";
    element.categories = [
      { id: "cat1", name: "" },
      { id: "cat2", name: "" },
      { id: "cat3", name: "" }
    ];
    element.items = [
      { id: "a", text: "", categoryId: "cat1" },
      { id: "b", text: "", categoryId: "cat1" },
      { id: "c", text: "", categoryId: "cat2" },
      { id: "d", text: "", categoryId: "cat3" }
    ];
    element.feedback_correct = "";
    element.feedback_incorrect = "";

  } else if (type === "select_from_text") {
    element.question = "";
    element.text = "";
    element.options = [
      { id: "a", text: "" },
      { id: "b", text: "" },
      { id: "c", text: "" },
      { id: "d", text: "" }
    ];
    element.correct = [];
    element.feedback_correct = "";
    element.feedback_incorrect = "";

  } else if (type === "fill_blank") {
    element.question = "";
    element.text = "";
    element.blanks = [
  { id:"1", answer:"", alternatives:"" }
];
    element.feedback_correct = "";
    element.feedback_incorrect = "";

} else if (type === "build_sentence") {
    element.question = "";
    element.tokens = [
      { id: "a", text: "" },
      { id:   "b", text: "" },
      { id: "c", text: "" },
      { id: "d", text: "" }
    ];
    element.correct_order = [
      "a",
      "b",
      "c",
      "d"
    ];
    element.feedback_correct = "";
    element.feedback_incorrect = "";

  } else if (type === "open_response") {
    element.question = "";
    element.model_answer = "";
    element.feedback_correct = "";

  } else {
    element.question = "";
  }

  card.elements.push(element);

  renderElements();
}

    function renderElements() {

  const container =
    document.getElementById("elementsList");

  const card =
    state.cards.find(
      c => c.order === state.activeCard
    );

  container.innerHTML = "";

  if (!card.elements.length) {

    container.innerHTML = `
      <div class="empty">
        Aucune puce pour le moment.<br>
        Cliquez sur « + Ajouter une puce ».
      </div>
    `;

    return;

  }

  card.elements.forEach((element, index) => {

    const wrapper =
      document.createElement("div");

    wrapper.className = "element";

    wrapper.innerHTML = `
      <div class="element-top">

        <div class="element-label">
          ${index + 1}. ${getElementTypeLabel(element.type)}
        </div>

        <div class="element-actions">

          <button
            type="button"
            class="btn btn-secondary btn-small"
            data-action="up">
            ↑
          </button>

          <button
            type="button"
            class="btn btn-secondary btn-small"
            data-action="down">
            ↓
          </button>

          <button
            type="button"
            class="btn btn-danger btn-small"
            data-action="delete">
            Supprimer
          </button>

        </div>

      </div>

      <div class="element-content">
        ${renderElementEditor(element, index)}
      </div>
    `;

    wrapper
      .querySelector('[data-action="up"]')
      .addEventListener("click", () => moveElement(index, -1));

    wrapper
      .querySelector('[data-action="down"]')
      .addEventListener("click", () => moveElement(index, 1));

    wrapper
      .querySelector('[data-action="delete"]')
      .addEventListener("click", () => deleteElement(index));

    container.appendChild(wrapper);

  });

}

let savedEditorSelection = null;

document.addEventListener("selectionchange", () => {

  const selection = window.getSelection();

  if (!selection || selection.rangeCount === 0) {
    return;
  }

  const range = selection.getRangeAt(0);

  const node =
    range.commonAncestorContainer.nodeType === 3
      ? range.commonAncestorContainer.parentElement
      : range.commonAncestorContainer;

  if (
    node &&
    node.closest &&
    node.closest('[contenteditable="true"]')
  ) {
    savedEditorSelection = range.cloneRange();
  }
});
function applyEditorColor(color) {

  if (!savedEditorSelection) {
    return;
  }

  const selection = window.getSelection();

  selection.removeAllRanges();
  selection.addRange(savedEditorSelection);

  document.execCommand(
    "foreColor",
    false,
    color
  );

  selection.removeAllRanges();
}

function moveElement(index, direction) {

  const card =
    state.cards.find(
      c => c.order === state.activeCard
    );

  if (!card) return;

  const newIndex =
    index + direction;

  if (
    newIndex < 0 ||
    newIndex >= card.elements.length
  ) {
    return;
  }

  [
    card.elements[index],
    card.elements[newIndex]
  ] = [
    card.elements[newIndex],
    card.elements[index]
  ];

  renderElements();

}

function addOrderingItem(index) {

  const card =
    state.cards.find(
      c => c.order === state.activeCard
    );

  if (!card) return;

  const element =
    card.elements[index];

  if (
    !element ||
    element.type !== "ordering"
  ) {
    return;
  }

  const id =
    `item_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;

  element.items.push({
    id,
    text: ""
  });

  element.correct_order =
    element.items.map(
      item => item.id
    );

  renderElements();
}


function deleteOrderingItem(index, itemId) {

  const card =
    state.cards.find(
      c => c.order === state.activeCard
    );

  if (!card) return;

  const element =
    card.elements[index];

  if (
    !element ||
    element.type !== "ordering"
  ) {
    return;
  }

  if (element.items.length <= 1) {
    return;
  }

  element.items =
    element.items.filter(
      item => item.id !== itemId
    );

  element.correct_order =
    element.items.map(
      item => item.id
    );

async function saveCards() {

  /*
   * Sauvegarder les champs de la carte
   * actuellement ouverte.
   */
  saveCurrentEditorToState();

  /*
   * Vérifier qu'une mission est sélectionnée.
   */
  if (!state.selectedMission) {

    showStatus(
      "Sélectionnez d'abord une mission.",
      "error"
    );

    return;

  }

  /*
   * Afficher dans la console exactement
   * ce que contient notre état avant
   * l'envoi vers Supabase.
   */
  console.log(
    "ACTIVITE — données avant sauvegarde :",
    JSON.parse(
      JSON.stringify(state.cards)
    )
  );

  /*
   * Construire les lignes à envoyer
   * dans mission_cards.
   */
  const rows =
    state.cards.map(card => ({

      mission_id:
        state.selectedMission.id,

      card_order:
        card.order,

      card_type:
        getCardType(card.order),

      title:
        card.title ||
        CARD_TYPES[
          getCardType(card.order)
        ],

      content: {

        title:
          card.title ||
          CARD_TYPES[
            getCardType(card.order)
          ],

        instruction:
          card.instruction || "",

        elements:
          card.elements.map(
            (element, index) => ({

              ...element,

              order:
                index + 1

            })
          )

      }

    }));

  /*
   * Afficher exactement ce qui va
   * être envoyé à Supabase.
   */
  console.log(
    "ACTIVITE — rows envoyées à Supabase :",
    JSON.parse(
      JSON.stringify(rows)
    )
  );

  /*
   * Sauvegarde Supabase.
   */
  const {
    data,
    error
  } = await supabaseClient
    .from("mission_cards")
    .upsert(
      rows,
      {
        onConflict:
          "mission_id,card_order"
      }
    )
    .select();

  /*
   * Afficher la réponse Supabase.
   */
  console.log(
    "ACTIVITE — réponse Supabase :",
    data
  );

  console.log(
    "ACTIVITE — erreur Supabase :",
    error
  );

  /*
   * Gestion de l'erreur.
   */
  if (error) {

    console.error(
      "ACTIVITE — sauvegarde impossible :",
      error
    );

    showStatus(
      "Erreur lors de l'enregistrement : " +
      error.message,
      "error"
    );

    return;

  }

  /*
   * Tout s'est bien passé.
   */
  showStatus(
    "Les 5 cartes ont été enregistrées ✓",
    "success"
  );

}

function renderPreview() {

  const card =
    state.cards.find(
      c => c.order === state.activeCard
    );

  const container =
    document.getElementById("previewElements");

  if (!card || !container) {
    return;
  }

  container.innerHTML = "";

  const visibleElements =
    card.elements.slice(
      0,
      state.previewIndex + 1
    );

  visibleElements.forEach((element, index) => {

    const div =
      document.createElement("div");

    div.className =
      "preview-element";

    div.innerHTML =
      ParlaMissionRenderer.renderElement(
        element,
        {
          cardKey: state.activeCard,
          elementIndex: index
        }
      );

    container.appendChild(div);

  });

  ParlaMissionRenderer.bindInteractions(
    container,
    card
  );

  document.getElementById("previewProgress").textContent =
    card.elements.length
      ? `${Math.min(
          state.previewIndex + 1,
          card.elements.length
        )} / ${card.elements.length}`
      : "Aucun élément";

  const next =
    document.getElementById("previewNext");

  if (
    !card.elements.length ||
    state.previewIndex >= card.elements.length - 1
  ) {
    next.style.display = "none";
  } else {
    next.style.display = "block";
  }

}

function convertYoutubeUrl(url) {

  if (!url) return "";

  try {

    const parsed =
      new URL(url);

    if (
      parsed.hostname.includes("youtube.com")
    ) {

      const videoId =
        parsed.searchParams.get("v");

      if (videoId) {
        return `https://www.youtube.com/embed/${videoId}`;
      }

    }

    if (
      parsed.hostname === "youtu.be"
    ) {

      const videoId =
        parsed.pathname.replace("/", "");

      if (videoId) {
        return `https://www.youtube.com/embed/${videoId}`;
      }

    }

  } catch (error) {

    return "";

  }

  return "";

}
